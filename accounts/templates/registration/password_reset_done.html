{% extends 'base.html' %}

{% block title %}E-mail Enviado — TechVerso{% endblock %}

{% block content %}
<div class="section-page" style="max-width:440px;">
  <div class="dark-card" style="text-align:center;padding:3rem 2rem;">
    <i class="fas fa-envelope-open-text" style="font-size:2.5rem;color:#00e5ff;margin-bottom:1.25rem;display:block;"></i>
    <h1 class="glitch-text" style="font-size:1.4rem;margin-bottom:1rem;" data-text="E-MAIL ENVIADO">E-MAIL ENVIADO</h1>
    <p style="color:#666;font-size:0.88rem;">Enviamos um e-mail com as instruções para redefinir sua senha.
    Se não chegar em alguns minutos, verifique sua pasta de spam.</p>
    <a href="{% url 'accounts:login' %}" class="btn-teal mt-3" style="display:inline-flex;">
      <i class="fas fa-arrow-left"></i> Voltar ao login
    </a>
  </div>
</div>
{% endblock %}
