{% extends 'base.html' %}
{% load static %}

{% block title %}Resetar Senha — TechVerso{% endblock %}

{% block content %}
<div class="section-page" style="max-width:440px;">
  <div class="section-header">
    <h1 class="glitch-text" data-text="RESETAR SENHA">RESETAR SENHA</h1>
    <p>Informe seu e-mail para receber as instruções</p>
  </div>

  <div class="dark-card">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_email">E-mail cadastrado:</label>
        <input type="email" name="email" class="form-control" id="id_email" placeholder="seu@email.com">
      </div>
      <button class="btn-teal w-100 mt-1" type="submit">
        <i class="fas fa-envelope"></i> Enviar instruções
      </button>
    </form>
    <div class="text-center mt-3" style="font-size:0.85rem;">
      <a href="{% url 'accounts:login' %}" style="color:#555;">Voltar ao login</a>
    </div>
  </div>
</div>
{% endblock %}
