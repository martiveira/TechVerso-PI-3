{% if messages %}
<div class="messages" style="max-width:900px;margin:0 auto;padding:1rem 1.5rem 0;">
  {% for message in messages %}
  <div {% if message.tags %}class="alert {{ message.tags }}"{% else %}class="alert"{% endif %} role="alert">
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}
